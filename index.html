<script>

let animations = ["is-fade", "slide-right", "slide-left", "slide-top", "slide-bottom", "is-bounce", "is-zoom", "is-flip", "is-fol", "is-roll", "is-elastic", "to-float-1", "to-float-2", "to-float3"];

animations.forEach(animation => {
  const observer = new IntersectionObserver(entries => { // Cria o observador
    entries.forEach(entry => { // Para cada elemento observado
      if (entry.isIntersecting) { // Se o elemento estiver visível na tela
        entry.target.classList.add(animation); // Adiciona a classe de animação
        observer.unobserve(entry.target); // Para de observar o elemento
      } else {
        entry.target.classList.remove(animation); // Remove a classe de animação
      }
    });
  }, { threshold: [0, 0.5, 1] }); // Define o threshold - (ponto de observação, para que o elemento seja animado)

  const elements = Array.from(document.querySelectorAll(`.${animation}`)); // Seleciona todos os elementos com a classe de animação
  elements.forEach(element => {
    observer.observe(element); // Observa cada elemento
  });
});
</script>




<script>
  document.addEventListener('DOMContentLoaded', function () {
    let tags = document.querySelectorAll('a')
    tags.forEach(tagA => {
      var urlLink = tagA.getAttribute('href')
      var urlParameters = window.location.search
      if (
        urlLink != 'javascript:;' &&
        urlLink != '' &&
        urlLink.charAt(0) !== '#'
      ) {
        if (urlParameters.charAt(0) === '?') {
          // Remover o ponto de interrogação da string
          urlParameters = urlParameters.substring(1)
        }
        var redirectUrl = urlLink
        redirectUrl += redirectUrl.includes('?')
          ? '&' + urlParameters
          : urlParameters != ''
          ? '?' + urlParameters
          : ''
        tagA.setAttribute('href', redirectUrl)
      }
    })
  })
</script>

    document.addEventListener("DOMContentLoaded", function () {
        /* ALTERE O VALOR 10 PARA OS SEGUNDOS EM QUE AS SEÇÕES VÃO APARECER */
        var SECONDS_TO_DISPLAY = 507;
        var CLASS_TO_DISPLAY = ".is-delay";
        /* DAQUI PARA BAIXO NAO PRECISA ALTERAR */
        var attempts = 0;
        var elsHiddenList = [];
        var elsDisplayed = false;
        var elsHidden = document.querySelectorAll(CLASS_TO_DISPLAY);
        var alreadyDisplayedKey = `alreadyElsDisplayed${SECONDS_TO_DISPLAY}`;
        var alreadyElsDisplayed = null;
        try {
            alreadyElsDisplayed = localStorage.getItem(alreadyDisplayedKey);
        } catch (e) {
            console.warn('Failed to read data from localStorage: ', e);
        }
        setTimeout(function () {
            elsHiddenList = Array.prototype.slice.call(elsHidden);
        }, 0);
        var showHiddenElements = function () {
            elsDisplayed = true;
            elsHiddenList.forEach((e) => e.style.display = "block");
            try {
                localStorage.setItem(alreadyDisplayedKey, true);
            } catch (e) {
                console.warn('Failed to save data in localStorage: ', e);
            }
        }
        var startWatchVideoProgress = function () {
            if (typeof smartplayer === 'undefined' || !(smartplayer.instances && smartplayer.instances.length)) {
                if (attempts >= 10) return;
                attempts += 1;
                return setTimeout(function () {
                    startWatchVideoProgress()
                }, 1000);
            }
            smartplayer.instances[0].on('timeupdate', () => {
                if (elsDisplayed || smartplayer.instances[0].smartAutoPlay) return;
                if (smartplayer.instances[0].video.currentTime < SECONDS_TO_DISPLAY) return;
                document.querySelectorAll(".is-delay").forEach(obj => obj.classList.remove("is-delay"));
                elementToScrool = document.querySelector(".vturb-scroll");
                if (elementToScrool) {
                    elementToScrool.scrollIntoView({
                        behavior: 'smooth'
                    });
                    document.querySelectorAll(".vturb-scroll").forEach(obj => obj.classList.remove("vturb-scroll"));
                }
            })
        }
        if (alreadyElsDisplayed === 'true') {
            setTimeout(function () {
                document.querySelectorAll(".is-delay").forEach(obj => obj.classList.remove("is-delay"));

                elementToScrool = document.querySelector(".vturb-scroll");
                if (elementToScrool) {
                    elementToScrool.scrollIntoView({
                        behavior: 'smooth'
                    });
                    document.querySelectorAll(".vturb-scroll").forEach(obj => obj.classList.remove("vturb-scroll"));
                }

            }, 100);

        } else {
            startWatchVideoProgress()
        }
    });
</script>
